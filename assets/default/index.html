<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{.Meta.Title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>{{.Styles}}</style>
</head>
<body>
    {{if .Meta.Title}}
    <header class="meta">
        <h1 class="meta-title">{{.Meta.Title}}</h1>
        {{if .Meta.Author}}<div class="meta-author">{{.Meta.Author}}</div>{{end}}
        {{if .Meta.Date}}<div class="meta-date">{{.Meta.Date}}</div>{{end}}
        {{if .Meta.Tags}}
        <div class="meta-tags">{{range .Meta.Tags}}<span class="tag">{{.}}</span>{{end}}</div>
        {{end}}
    </header>
    {{end}}

    <main class="content">
        {{.Content}}
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        (function () {
            // Convert <pre><code class="language-mermaid"> → <div class="mermaid">
            // BEFORE Prism so the diagram source isn't tokenised as code.
            document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
                var div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = code.textContent;
                code.parentElement.replaceWith(div);
            });

            if (window.Prism) { Prism.highlightAll(); }

            if (window.mermaid) {
                window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
                window.mermaid.run().catch(function (e) { console.error('mermaid:', e); });
            }
        })();
    </script>
</body>
</html>
